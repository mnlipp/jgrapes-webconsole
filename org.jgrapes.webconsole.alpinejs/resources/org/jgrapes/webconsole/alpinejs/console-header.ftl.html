<header id="ajs-console-header">

  <!-- Top navigation -->
  <span><#include "console-brand.ftl.html"></span>
  <!-- Items are set by the renderer -->
  <aash2-dropdown-menu id="conlet-menu"
    action="function(value) { $consoleRenderer.addConlet(value) }">
    <template provides="label">
      <span class='fa fa-puzzle-piece'></span>
    </template>
    <template x-for="conletData of $consoleRenderer.conletTypeMgr.menuItems()"
      :key="conletData.type">
      <template provides="item" :with-value="conletData.type">
        <span x-text="$consoleRenderer.conletTypeMgr.displayName(conletData.type)"></span>
      </template>
    </template>
  </aash2-dropdown-menu>
  <aash2-dropdown-menu id="language-selector"
    action="function(value) { document.querySelector('html').setAttribute('lang', value) }">
    <template provides="label">
      <span class='fa fa-language'></span>
    </template>
    <template x-for="labelKey of $consoleRenderer.localeMenuItems()">
      <template provides="item" :with-value='`${"$"}{labelKey[1]}`'>
        <span x-text="`${"$"}{labelKey[0]}`"></span>
      </template>
    </template>
  </aash2-dropdown-menu>
  <#include "console-header-append.ftl.html">

</header>
