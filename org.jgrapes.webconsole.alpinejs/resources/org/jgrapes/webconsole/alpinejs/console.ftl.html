<!doctype html>

<html lang="${locale.toLanguageTag()}">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Console -->
<link rel="icon" href="${renderSupport.consoleResource('favicon.ico')}">
<title>${_("consoleTitle")}</title>

<!-- CSS -->
<link rel="stylesheet" 
  href="${renderSupport.consoleResource('lib/normalize.css')}">
<link rel="stylesheet"
  href="${renderSupport.pageResource('gridstack/gridstack' + minifiedExtension + '.css')}" />
<!-- Console -->
<link rel="stylesheet"
  href="${renderSupport.pageResource('fork-awesome/css/fork-awesome' + minifiedExtension + '.css')}" />

<!-- Scripts(s) -->
<!-- Gridstack -->
<script data-jgwc-provides="gridstack"></script>
<!-- More... -->
</head>

<body id="page-top" class="index console-alpinejs">

  <!-- Loader -->
  <div id="loader-overlay">
    <div></div>
  </div> 

  <#include "console-header.ftl.html">

  <main role="main">

  <div class="consoleAlpineJs">
    <aash-tablist id="consoleTabs">
      <template provides="remove-label">
        <span class="fa fa-times"></span>
      </template>
      <template provides="tab" panel-id="consoleOverviewPanel">
        <span x-text="$consoleRenderer.localize('Overview')"></span>
      </template>
      <template x-for="view of $consoleRenderer.conletMgr.views" :key="view.id">
        <template provides="tab" :panel-id="view.panelId"
          :remove-callback='`$consoleRenderer.conletMgr.removeView("${"$"}{view.id}")`'>
          <span x-text="view.evalTitle()"></span>
        </template>
      </template>
    </aash-tablist>
  </div>
  <div id="consolePanels">
    <section id="consoleOverviewPanel" role="tabpanel" hidden>
      <div id="consolePreviews" class="grid-stack" role="grid">
      </div>
    </section>
  </div>

  </main>

  <!-- Footer -->
  <#include "console-footer.ftl.html">

  <!-- Notification area -->
  <div id="notification-area" x-data>
    <template x-for="entry of $consoleRenderer.notificationMgr.entries"
      :key="entry.id">
      <div role="alert" :class="entry.notificationClass()">
        <p x-html="entry.content"></p>
        <button x-show="entry.options.closeable !== false" type="button"
          class="fa fa-times"
          @click="$consoleRenderer.notificationMgr.remove(entry.id)"></button>
      </div>
    </template>
  </div>

  <aash-modal-dialog id="suspended-dialog">
    <template provides="dialog-title">
      <span x-text="$consoleRenderer.localize('Console Session Suspended')"></span>
    </template>
    <template provides="content">
      <span x-text="$consoleRenderer.localize('consoleSessionSuspendedMessage')"></span>
    </template>
    <template provides="okay-label">
      <span x-text="$consoleRenderer.localize('Resume')"></span>
    </template>
  </aash-modal-dialog>

<script type="module">
import "${renderSupport.pageResource('aash-alpinejs/aash-alpinejs-components.js')}";
import JGConsole from "${renderSupport.consoleBaseResource('jgconsole.js')}";
import Alpine from "${renderSupport.pageResource('alpinejs/module.esm.js')}";    
import AlpineJsRenderer from "${renderSupport.consoleResource('alpinejsrenderer.js')}";

const localeMenuitems = [
  // <#list supportedLanguages() as l>
  ['${l.label}', '${l.locale.toLanguageTag()}'],
  // </#list>
];

const consoleMessages = new Map();
let l10ns = null;
// <#list supportedLanguages() as l>
l10ns = new Map();
consoleMessages.set('${l.locale.toLanguageTag()}', l10ns);
// <#list l.l10nBundle.keys as key>
l10ns.set('${key}', '${l.l10nBundle.getString(key)}');
// </#list>
// </#list>    

const renderer = new AlpineJsRenderer(
    JGConsole.instance, localeMenuitems, consoleMessages);

document.addEventListener('readystatechange', event => { JGConsole.init(
    "${consoleConnectionId}",
    { refreshInterval: parseInt('${connectionRefreshInterval.toMillis()?c}'),
      inactivityTimeout: parseInt('${connectionInactivityTimeout.toMillis()?c}') });
    });

</script>
 
</body>
</html>
