<!DOCTYPE html>
<html>
<script type="importmap">
{
  "imports": {
    "lit": "/node_modules/lit/index.js",
    "lit/": "/node_modules/lit/",
    "lit-element": "/node_modules/lit-element/index.js",
    "lit-element/": "/node_modules/lit-element/",
    "lit-html": "/node_modules/lit-html/lit-html.js",
    "lit-html/": "/node_modules/lit-html/",
    "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
    "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
  }
}
</script>
<head>
  <title>AaSH Demo</title>
  <style>
  html {
      box-sizing: border-box;
  }

  *, *:before, *:after {
      box-sizing: inherit;
  }

  </style>
</head>
<body>
  <main>
    <h1>AashTablist Demo</h1>

    <aash-tablist id="demoTabs"></aash-tablist>
    <div id="panel-1" role="tabpanel">
      <h2>Panel One</h2>
      <p>This is the content of panel one.</p>
    </div>
    <div id="panel-2" role="tabpanel" hidden>
      <h2>Panel Two</h2>
      <p>This is the content of panel two.</p>
    </div>
    <div id="panel-3" role="tabpanel" hidden>
      <h2>Panel Three</h2>
      <p>This is the content of panel three.</p>
    </div>

    <p>
      <button id="addBtn">Add Panel</button>
      <button id="removeBtn">Remove Selected</button>
    </p>
  </main>

  <script type="module">
    import '../lib/aash-lit-components.js';

    const tablist = document.getElementById('demoTabs');

    tablist.addPanel({ id: 'panel-1', label: 'Tab 1' });
    tablist.addPanel({ id: 'panel-2', label: 'Tab 2' });
    tablist.addPanel({ id: 'panel-3', label: 'Tab 3' });

    let panelCounter = 4;

    document.getElementById('addBtn').addEventListener('click', () => {
      const id = 'panel-' + panelCounter++;
      const div = document.createElement('div');
      div.id = id;
      div.setAttribute('role', 'tabpanel');
      div.innerHTML = '<h2>Panel ' + (panelCounter - 1) + '</h2><p>Dynamically added panel.</p>';
      div.setAttribute('hidden', '');
      tablist.after(div);
      tablist.addPanel({
        id: id,
        label: 'Tab ' + (panelCounter - 1),
        removeCallback: () => {
          tablist.removePanel(id);
          let el = document.getElementById(id);
          if (el) el.remove();
        }
      });
    });

    document.getElementById('removeBtn').addEventListener('click', () => {
      const panels = tablist.panels();
      const tab = document.querySelector('.aash-tablist [aria-selected="true"]');
      if (!tab) return;
      const selectedId = tab.getAttribute('aria-controls');
      const selected = panels.find(p => p.id === selectedId);
      if (selected && selected.removeCallback) {
        selected.removeCallback();
      }
    });
  </script>
</body>
</html>
