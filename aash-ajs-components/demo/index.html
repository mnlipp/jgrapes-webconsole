<!DOCTYPE html>
<html>
<script type="importmap">
{
  "imports": {
    "alpinejs": "/node_modules/alpinejs/dist/module.esm.js"
  }
}
</script>

<head>
  <title>AaSH Demo</title>
  <style>
  html {
      box-sizing: border-box;
  }

  *, *:before, *:after {
      box-sizing: inherit;
  }

  </style>
  <script type="module">
  import Alpine from 'alpinejs';
  window.Alpine = Alpine;
  if (document.readyState !== "loading") {
    queueMicrotask(() => {
      Alpine.start()
    });
  } else {
    addEventListener("DOMContentLoaded", (event) => {
      queueMicrotask(() => {
        Alpine.start()
      });
    });
  }
  </script>
</head>
<body>
  <main x-data="{ items: 3 }">
    <h1>AashDropdownMenu Demo</h1>

    <aash-dropdown-menu id="language-selector"
      action="value => window.alert(value)">
      <template provides="label">
        <span>Language</span>
      </template>
      <template provides="item" with-value="en">
        <span provides="item">English</span>
      </template>
      <template provides="item" with-value="de">
        <span provides="item">German</span>
      </template>
      <template x-for="i in items">
        <template provides="item" :with-value='`x${i}`'>
          <span x-text="`Item ${i}`"></span>
        </template>
      </template>
    </aash-dropdown-menu>

    <p>
      <label x-data">
        Extra Items: 
        <input type="number" value="3" step="1" x-model.number="items">
      </label>
    </p>

    <h1>AashTablist Demo</h1>

    <aash-tablist id="demoTabs">
      <template provides="tab" panel-id="panel-1">
        <span>Tab 1</span>
      </template>
      <template provides="tab" panel-id="panel-2">
        <span>Tab 2</span>
      </template>
      <template provides="tab" panel-id="panel-3">
        <span>Tab 3</span>
      </template>
    </aash-tablist>
    
    <div id="panel-1" role="tabpanel">
      <h2>Panel One</h2>
      <p>This is the content of panel one.</p>
    </div>
    <div id="panel-2" role="tabpanel" hidden>
      <h2>Panel Two</h2>
      <p>This is the content of panel two.</p>
    </div>
    <div id="panel-3" role="tabpanel" hidden>
      <h2>Panel Three</h2>
      <p>This is the content of panel three.</p>
    </div>

    <p>
      <button id="addBtn">Add Panel</button>
    </p>

    <script type="module">
      import '../lib/aash-alpinejs-components.js';

      const tablist = document.getElementById('demoTabs');

      let panelCounter = 4;

      document.getElementById('addBtn').addEventListener('click', () => {
        const id = 'panel-' + panelCounter++;
        const label = 'Tab ' + (panelCounter - 1);
        const div = document.createElement('div');
        div.id = id;
        div.setAttribute('role', 'tabpanel');
        div.innerHTML = '<h2>Panel ' + (panelCounter - 1) + '</h2><p>Dynamically added panel.</p>';
        div.setAttribute('hidden', '');
        tablist.after(div);
        const tpl = document.createElement('template');
        tpl.setAttribute('provides', 'tab');
        tpl.setAttribute('panel-id', id);
        tpl.setAttribute('remove-callback',
          `document.querySelector('aash-tablist').removePanel('${id}');
           document.getElementById('${id}').remove()`);
        tpl.innerHTML = `<span>${label}</span>`;
        tablist.appendChild(tpl);
      });
    </script>

    <h1>AashModalDialog Demo</h1>

    <p>
      <button id="openDialog">Open Dialog</button>
    </p>
    <aash-modal-dialog id="sampleDialog">
      <template provides="dialog-title">
        <span>Sample Dialog</span>
      </template>
      <template provides="cancel-label">
        <span>×</span>
      </template>
      <template provides="apply-label">
        <span>Apply</span>
      </template>
      <template provides="okay-label">
        <span>OK</span>
      </template>
      <template provides="content">
        <i>Sample dialog content</i>
      </template>
    </aash-modal-dialog>

    <p>
      <button id="openDialogSubmit">Open Dialog (Submit)</button>
    </p>
    <aash-modal-dialog id="sampleDialogSubmit"
        submit-form="toBeSubmitted">
      <template provides="cancel-label">
        <span>×</span>
      </template>
      <template provides="dialog-title">
        <p>Sample Dialog (Submit)</p>
      </template>
      <template provides="content">
        <form id="toBeSubmitted">
          <input type="text" name="user">
          <input type="password" name="password">
        </form>
      </template>
    </aash-modal-dialog>

    <script type="module">
      import '../lib/aash-alpinejs-components.js';
        
      const sampleDialog = document.getElementById('sampleDialog');
      sampleDialog.action = (confirmed, close) => {
        window.alert(confirmed + ' ' + close);
      };

      const sampleDialogSubmit = document.getElementById('sampleDialogSubmit');
      sampleDialogSubmit.action = (confirmed, close) => {
        window.alert(confirmed + ' ' + close);
      };

      document.getElementById('openDialog').addEventListener('click', () => {
        sampleDialog.open();
      });

      document.getElementById('openDialogSubmit').addEventListener('click', () => {
        sampleDialogSubmit.open();
      });
    </script>

  </main>
  
</body>
</html>
