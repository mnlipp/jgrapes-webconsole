<div class="FormTest-view"
  data-jgwc-on-load="orgJGrapesConletStyleTest2.initView"
  data-jgwc-on-unload="orgJGrapesConletStyleTest2.cleanup"
  x-data="orgJGrapesConletStyleTest2">

  <h1>Style Tests (Aash2 components)</h1>

  <aash2-accordion>
    <details>
      <summary><h2 x-text="localize('Disclosure (in table)')"></summary>
        
      <table class="table--basic--striped jgrapes-osgi-style-test-table-with-disclosures"
        x-data="{
          controller: new JGConsole.TableController([
            ['year', 'Year'],
            ['month', 'Month'],
            ['title', 'Title'],
            ], {
            sortKey: 'year'
          }),
          detailsByKey: {},
          issues: [
            { year: 2019, month: 6, title: 'Middle of year' },
            { year: 2019, month: 12, title: 'End of year' },
            { year: 2020, month: 1, title: 'A new year begins' },
          ],
          get filteredData() {
            let infos = Object.values(this.issues);
            return this.controller.filter(infos);
          }
        }">
        <thead>
          <tr>
          <template x-for="key in controller.keys">
            <th aria-role="button" tabindex="0" class="sortable"
              x-on:click="controller.sortBy(key)"
              ><just-text x-text="localize(controller.label(key))"></just-text
                ><span x-show="controller.sortedByAsc(key)">&#x25B2;</span
                ><span x-show="controller.sortedByDesc(key)">&#x25BC;</span>
            </th>
          </template>
          </tr>
        </thead>
        <template x-for="(entry, rowIndex) in filteredData">
          <tbody x-id="['row']">
            <tr role="row" :class="[(rowIndex % 2) ? 'odd' : 'even']">
              <td>
                <template x-if="rowIndex === 0">
                  <aash2-disclosure-button :id-ref="$id('row')"
                    on-toggle="function() { JGConsole.notification('Changed.') }"
                    on-show="function() { JGConsole.notification('Now showing.') }"
                    on-hide="function() { JGConsole.notification('Now hidden.') }"
                    ><span x-html="entry[controller.keys[0]]"></span>
                  </aash2-disclosure-button>
                </template>
                <template x-if="rowIndex !== 0">
                  <aash2-disclosure-button :id-ref="$id('row')"
                    wrapper-type="div"
                    ><span x-html="entry[controller.keys[0]]"></span>
                  </aash2-disclosure-button>
                </template>
              </td>
              <template x-for="(key, colIndex) in controller.keys.slice(1)">
              <td>
                <span x-html="entry[key]"></span>
                <span x-show="key === 'title' 
                  && $store.$aash.isDisclosed($id('row'))">(see below)</span>
              </td>
              </template>
            </tr>
            <tr :id="$id('row')" x-show="$store.$aash.isDisclosed($id('row'))"
              class="details" :class="[(rowIndex % 2) ? 'odd' : 'even']">
              <td colspan="3">
                Those are the details...
              </td>
            </tr>
          </tbody>
        </template>
      </table>
    </details>

    <details>
      <summary><h2 x-text="'Tree'"></summary>
      <div style="display: flex;">
        <div style="min-width: 20%;">
          <aash2-tree-view on-toggle="(path, newStateOpen, event) => {
              logToggleMessage(path.join('/') + ' now ' 
                + (newStateOpen ? 'disclosed' : 'concealed'));
              return newStateOpen;
            }"
            on-focus="(path) => {
              logToggleMessage(path.join('/') + ' has focus');
            }"
            on-selected="(path, event) => {
              logToggleMessage(path.join('/') + ' selected');
            }"
            roots='[
            {
              "segment": "fruits",
              "label": "Fruits",
              "children": [
                {
                  "segment": "oranges",
                  "label": "Oranges"
                },
                {
                  "segment": "pineapple",
                  "label": "Pineapple"
                },
                {
                  "segment": "apples",
                  "label": "Apples",
                  "children": [
                    {
                      "segment": "macintosh",
                      "label": "Macintosh"
                    },
                    {
                      "segment": "granny_smith",
                      "label": "Granny Smith"
                    },
                    {
                      "segment": "fuji",
                      "label": "Fuji"
                    }
                  ]
                },
                {
                  "segment": "bananas",
                  "label": "Bananas"
                },
                {
                  "segment": "pears",
                  "label": "Pears",
                  "children": [
                    {
                      "segment": "anjou",
                      "label": "Anjou"
                    },
                    {
                      "segment": "bartlett",
                      "label": "Bartlett"
                    },
                    {
                      "segment": "bosc",
                      "label": "Bosc"
                    }
                  ]
                }
              ]
            },
            {
              "segment": "vegetables",
              "label": "Vegetables"
            },
            {
              "segment": "grains",
              "label": "Grains"
            }
          ]'></aash2-tree-view>
        </div>
        <div style="padding-left: 1em;">
          <p>
            <div>
              <ul>
                <template x-for="msg in toggleMessages">
                <li x-text="msg"></li>
                </template>
              </ul>
            </div>
            <toggle-event-list :messages="toggleMessages"></toggle-event-list>
          </p>
        </div>
      </div>
    </details>

    <details>
      <summary><h2 x-text="localize('Miscellaneous')"></summary>

      <dl>
        <dt>Button:</dt>
        <dd>Disabled button: <button disabled>Start</button></dd>
        <dd>Disabled button (role): <span role="button" 
              class="fa fa-play" aria-disabled="true"
              title="Start"></span></dd>
      </dl>
    </details>
  </aash2-accordion>

</div>
